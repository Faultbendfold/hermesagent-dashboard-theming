# Minimal Dark -- generated by tools/new-theme.py, then reviewed by hand.
# Enable with:  hermes config set dashboard.theme minimal-dark
# Check with:   python3 skills/hermes-dashboard-theming/scripts/theme-check.py minimal-dark.yaml

name: minimal-dark
label: Minimal Dark
description: Minimal Dark theme in the dark mode.

palette:
  background: "#0F1115"   # the canvas: what everything else is measured against
  midground: "#E6E8EC"    # the ink: lifted to >= 7:1 against the canvas
  foreground:
    hex: "#FFFFFF"
    alpha: 0
  noiseOpacity: 0

typography:
  fontSans: '"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'
  fontMono: 'ui-monospace, "SF Mono", Menlo, Consolas, monospace'
  baseSize: "15px"
  lineHeight: "1.6"
  # fontDisplay is accepted but the shipped build does not use it --
  # heading fonts need a customCSS rule (references/typography-and-fonts.md).

layout:
  radius: "0.8rem"
  density: comfortable

colorOverrides:
  card: "#1C1E22"
  cardForeground: "#E6E8EC"
  popover: "#1C1E22"
  popoverForeground: "#E6E8EC"
  primary: "#7FC9C9"
  primaryForeground: "#0F1115"
  secondary: "#17191D"
  secondaryForeground: "#E6E8EC"
  muted: "#222428"
  mutedForeground: "#898A8E"
  accent: "#17191D"
  accentForeground: "#E6E8EC"
  destructive: "#CB6860"
  destructiveForeground: "#0F1115"
  success: "#3D965E"
  warning: "#C56E3C"
  border: "#3A3C40"
  input: "#3A3C40"
  ring: "#7FC9C9"

# seriesColors is accepted by the server and then dropped: the chart colours
# only arrive through customCSS (--series-input-token/--series-output-token,
# each with !important, because the client writes them inline).

componentStyles:
  card:
    background: "#1C1E22"
  header:
    background: "#17191D"
  sidebar:
    background: "#17191D"
  # Only card/header/sidebar/tab are read at all, and only background,
  # border-image, clip-path (card additionally box-shadow). badge, page,
  # progress, backdrop and footer are dead configuration.

customCSS: |
  /* Everything the tokens cannot reach. Keep this under 32 KiB. */
  :root {
    --series-input-token: #7FC9C9 !important;
    --series-output-token: #7FC9C9 !important;
  }

