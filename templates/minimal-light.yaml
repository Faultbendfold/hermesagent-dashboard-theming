# Minimal Light -- generated by tools/new-theme.py, then reviewed by hand.
# Enable with:  hermes config set dashboard.theme minimal-light
# Check with:   python3 skills/hermes-dashboard-theming/scripts/theme-check.py minimal-light.yaml

name: minimal-light
label: Minimal Light
description: Minimal Light theme in the light mode.

palette:
  background: "#F8F9FB"   # the canvas: what everything else is measured against
  midground: "#111827"    # the ink: lifted to >= 7:1 against the canvas
  foreground:
    hex: "#FFFFFF"
    alpha: 0
  noiseOpacity: 0

typography:
  fontSans: '"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'
  fontMono: 'ui-monospace, "SF Mono", Menlo, Consolas, monospace'
  baseSize: "15px"
  lineHeight: "1.6"
  # fontDisplay is accepted but the shipped build does not use it --
  # heading fonts need a customCSS rule (references/typography-and-fonts.md).

layout:
  radius: "0.8rem"
  density: comfortable

colorOverrides:
  card: "#FFFFFF"
  cardForeground: "#111827"
  popover: "#FFFFFF"
  popoverForeground: "#111827"
  primary: "#0F766E"
  primaryForeground: "#FFFFFF"
  secondary: "#F4F6F9"
  secondaryForeground: "#111827"
  muted: "#ECEEF0"
  mutedForeground: "#696C74"
  accent: "#F4F6F9"
  accentForeground: "#111827"
  destructive: "#B42318"
  destructiveForeground: "#FFFFFF"
  success: "#15803D"
  warning: "#B54708"
  border: "#D8DADD"
  input: "#D8DADD"
  ring: "#0F766E"

# seriesColors is accepted by the server and then dropped: the chart colours
# only arrive through customCSS (--series-input-token/--series-output-token,
# each with !important, because the client writes them inline).

componentStyles:
  card:
    background: "#FFFFFF"
  header:
    background: "#F4F6F9"
  sidebar:
    background: "#F4F6F9"
  # Only card/header/sidebar/tab are read at all, and only background,
  # border-image, clip-path (card additionally box-shadow). badge, page,
  # progress, backdrop and footer are dead configuration.

customCSS: |
  /* Everything the tokens cannot reach. Keep this under 32 KiB. */
  :root {
    --series-input-token: #0F766E !important;
    --series-output-token: #0F766E !important;
  }

