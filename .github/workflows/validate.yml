name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Everything the tools need is in the standard library, and this is the
      # same script a contributor runs locally: ./tools/verify.sh
      - name: run the repository checks
        run: ./tools/verify.sh
